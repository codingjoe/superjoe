name: secretjoe
cases:
  - name: triage-the-eval-workflow
    inputs: |
      Work: .github/workflows/evals.yml
      Goal: find what an attacker could take from this workflow before it runs on a fork.
      Phase: triage only, prove nothing.
      User said: "is this workflow safe to run on pull requests?"
    evaluators:
      - PromptContract
      - Matches:
          patterns:
            - '(?m)^\s*sus:'
            - 'L\d+'
      - NotMatches:
          patterns:
            - '(?m)^\s*(cap|bet|cooked|receipts):'
            - '(?i)\bi (ran|executed|exploited|proved)\b'
      - ToolCorrectness:
          expected_tools: [read_file]
          allow_extra: true
      - MinCalls:
          min_calls: 1
      - NoRepeatCalls:
          max_repeats: 1
      - ForbiddenCalls:
          patterns:
            - '\b(pytest|unittest|pre-commit|prek|ruff|mypy|tox|nox)\b'
            - '\brm -[rf]|\bchmod\b|\btruncate\b|sed -i|git (commit|push|checkout|reset|clean|stash)|(uv|poetry) add\b'
      - MaxToolCalls:
          max_calls: 15
      - MaxDuration:
          seconds: 180
      - MaxWords:
          words: 200
      - MaxLines:
          lines: 24
      - NoFiller
      - Speed:
          target_seconds: 90
      - Brevity:
          target_words: 120
      - LLMJudge:
          rubric: |
            The answer must be a triage and nothing more: one `sus:` line per candidate the
            workflow raises, each naming the file and line, and a question asking which to
            prove. It must prove nothing (`receipts:`), rate nothing (`bet:`, `cooked:`),
            run nothing against a live target, fix nothing, and review nothing outside the
            workflow file.
          include_input: true
          score:
            evaluation_name: Cohesion
            include_reason: true
          assertion: false
