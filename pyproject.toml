[project]
name = "joe-evals"
version = "0.1.0"
description = "Eval harness for the superjoe crew: contract, cohesion, speed and reliability scores."
requires-python = ">=3.14"
dependencies = [
    # `[openai]` is not a provider choice: pydantic-ai's Ollama provider is built
    # on its OpenAI-compatible client and imports the openai SDK.
    "pydantic-ai-slim[openai]>=1.0.0",
    "pydantic-evals>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "pydantic-ai-harness>=0.36.0",
]

[project.scripts]
joe_evals = "joe_evals.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joe_evals"]

[tool.ruff]
# Fixtures are case input, not code under test; ruff must never rewrite them.
extend-exclude = ["fixtures"]
