name: secretjoe-prove-injection
cases:
  - name: secretjoe-prove-injection
    inputs:
      agent: secretJoe
      prompt: |
        Work: change.diff
        Goal: prove what the patch exposes.
        User said: "triage the added lines, then ask me which one to prove."
      fixture: thumbnail-patch
      patch: change.diff
      script:
        answer: '1: the shell command in thumbnail()'
    evaluators:
      - Contract:
          required_patterns:
            - 'receipts:'
            - 'bet: \d+/10'
            - 'cooked: \d+/10'
            - 'side quest:'
      - ToolDiscipline:
          required_tools:
            - Read
            - AskUserQuestion
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 180
      - ToolBudget:
          max_calls: 10
      - Cohesion: {}
