name: evals
on:
  pull_request:
    # labeled, so applying the run-evals-full label starts the full run
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/evals.yml
      - agents/**
      - cases/**
      - fixtures/**
      - joe_evals/**
      - models.yaml
      - pyproject.toml
  push:
    # a main commit refreshes the baseline; a baseline commit alone matches none of these paths
    branches: [main]
    paths:
      - .github/workflows/evals.yml
      - agents/**
      - cases/**
      - fixtures/**
      - joe_evals/**
      - models.yaml
      - pyproject.toml
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to score with; defaults to models.yaml
        default: ''
permissions:
  contents: read
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This job runs the branch's own harness, so it holds no write scope and reaches no API beyond
    # the artifacts it uploads. The boundary it works within: a fork pull request gets no secrets,
    # so only a branch of this repository reaches a keyed run at all, and even that run cannot
    # comment, label or push - the `comment` job below owns the write token instead.
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.key.outputs.ran }}
      commented: ${{ steps.comment.outputs.commented }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Check for the API key
        id: key
        env:
          # the key sits on the steps that need it, never on the job: see the build step below
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo 'ran=false' >> "$GITHUB_OUTPUT"
            echo 'OLLAMA_API_KEY is not configured; the eval run is skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ran=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the sandbox image
        # The branch's Dockerfile runs here, in a step with no secret in its environment, no write
        # scope, and a digest-pinned base: its `RUN` lines reach nothing this workflow holds. The
        # harness finds the tag already built and reuses it instead of building again.
        if: steps.key.outputs.ran == 'true'
        run: docker build --tag joe-evals-sandbox:latest joe_evals
      - name: Run the cases
        if: steps.key.outputs.ran == 'true'
        env:
          # only the steps that talk to a model carry the key
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          # toJSON keeps the label lookup valid for push and dispatch runs, which carry no labels
          FULL: ${{ contains(toJSON(github.event.pull_request.labels.*.name), 'run-evals-full') }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ "$FULL" = 'true' ]; then
            repeats=3
            models=$(yq -r '.sweep[]' models.yaml)
          else
            repeats=1
            models=${MODEL:-$(yq -r '.default_model' models.yaml)}
          fi
          for model in $models; do
            uv run --locked joe_evals run --repeats "$repeats" --model "$model" --out "scores-$model.json"
          done
      - name: Render the delta
        # Rendering is local work on the uploaded report, and a regression fails the run here. The
        # `comment` job posts the result, because posting needs a token this job must not hold.
        id: comment
        if: always() && steps.key.outputs.ran == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The gate reads the baseline off the base branch, never the copy this pull request
          # carries: a branch must not be judged against a file it can edit. A base branch without
          # one yet - the pull request that first adds the harness - reads as no baseline at all.
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:baseline.json > "$RUNNER_TEMP/baseline.json" ||
            echo '{"model":"","created_at":"1970-01-01T00:00:00Z","cases":[],"ratings":{}}' > "$RUNNER_TEMP/baseline.json"
          report="scores-$(yq -r '.default_model' models.yaml).json"
          status=0
          uv run --locked joe_evals comment --report "$report" --baseline "$RUNNER_TEMP/baseline.json" --out comment.md || status=$?
          if [ -s comment.md ]; then
            echo 'commented=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Upload the scores
        if: always() && steps.key.outputs.ran == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: evals-scores
          path: scores-*.json
      - name: Upload the comment
        if: always() && steps.key.outputs.ran == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: evals-comment
          path: comment.md
          if-no-files-found: ignore
  comment:
    # The write token lives here and nowhere else. No branch code is checked out: the job downloads
    # the rendered comment and posts it through workflow-inline `gh` calls.
    needs: evals
    if: ${{ !cancelled() && needs.evals.outputs.commented == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: evals-comment
      - name: Post the sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # the marker alone would match a bystander comment that quotes it, so match the author too
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("## superjoe evals")) | .id' \
            | tail -1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
  baseline:
    # a skipped run uploads no scores, so a main push without the key leaves the baseline alone
    needs: evals
    if: github.event_name == 'push' && needs.evals.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/download-artifact@v8
        with:
          name: evals-scores
      - name: Refresh the baseline
        run: |
          report="scores-$(yq -r '.default_model' models.yaml).json"
          uv run --locked joe_evals baseline --report "$report" --out baseline.json
      - name: Commit the baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseline.json
          if git diff --cached --quiet; then
            echo 'the baseline already matches main'
            exit 0
          fi
          git commit -m 'Refresh the eval baseline'
          git push
