name: researchjoe
cases:
  - name: verify-pydantic-ai-harness
    inputs: |
      Work: pyproject.toml
      Goal: decide whether pydantic-ai-harness still earns its place among the dependencies.
      Phase: report
      Ledger: none
      User said: "is pydantic-ai-harness maintained, or should we drop it?"
    evaluators:
      - Contains:
          value: pydantic-ai-harness
          evaluation_name: names-package
      - ToolCorrectness:
          expected_tools: [shell]
          allow_extra: true
      - PromptContract:
          extra: [Phase, Ledger]
      - FindingContract
      - MinCalls:
          min_calls: 2
      - NoRepeatCalls:
          max_repeats: 1
      - ForbiddenCalls:
          patterns:
            - '\b(pytest|unittest|pre-commit|prek|ruff|mypy|tox|nox)\b'
            - '\brm -[rf]|\bchmod\b|\btruncate\b|sed -i|git (commit|push|checkout|reset|clean|stash)|(uv|poetry) add\b'
      - MaxDuration:
          seconds: 180
      - MaxToolCalls:
          max_calls: 20
      - MaxWords:
          words: 250
      - MaxLines:
          lines: 40
      - NoFiller
      - NotMatches:
          patterns:
            - '(?i)\bi (added|removed|changed|deleted|edited|applied|ran|executed)\b'
      - Speed:
          target_seconds: 90
      - Brevity:
          target_words: 180
      - LLMJudge:
          rubric: |
            The answer must read as one finished report for the task: it answers whether
            pydantic-ai-harness should stay a dependency, keeps one goal and one voice, and
            grounds every claim in a lookup it performed. It carries the verdict row — a
            `kept:` or `dropped:` line, the `deps` lane, and the key
            `[deps:pydantic-ai-harness]` — and one lookup answers it, so no later lane
            repeats the question. It must not claim to have changed, added, or removed any
            code.
          include_input: true
          score:
            evaluation_name: Cohesion
            include_reason: true
          assertion: false
