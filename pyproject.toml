[project]
name = "joe-evals"
version = "0.1.0"
description = "Eval harness for the superjoe crew: contract, cohesion, speed and reliability scores."
requires-python = ">=3.10"
dependencies = [
    # `[openai]` is not a provider choice: pydantic-ai's Ollama provider is built
    # on its OpenAI-compatible client and imports the openai SDK.
    "pydantic-ai-slim[openai]>=1.0.0",
    "pydantic-evals>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "testcontainers>=4.0",
]

[project.scripts]
joe_evals = "joe_evals.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joe_evals"]

[tool.ruff]
line-length = 120
# Fixtures are case input, not code under test; ruff must never rewrite them.
extend-exclude = ["fixtures"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Ruff's classic default set, pinned so a new default rule cannot fail the hooks unannounced.
select = ["E4", "E7", "E9", "F"]
