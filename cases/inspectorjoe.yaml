name: inspectorjoe
cases:
  - name: triage-the-eval-harness
    inputs: |
      Work: joe_evals/__main__.py
      Goal: catch what the harness gets wrong before it bites in CI.
      Phase: triage only, investigate nothing.
      User said: "review this file"
    evaluators:
      - PromptContract
      - Matches:
          patterns:
            - '(?m)^\s*sus:'
            - 'L\d+'
      - NotMatches:
          patterns:
            - '(?m)^\s*(cap|bet|cooked|receipts):'
            - '(?i)\bi (fixed|patched|applied|changed|edited|corrected|ran)\b'
      - ToolCorrectness:
          expected_tools: [read_file]
          allow_extra: true
      - MinCalls:
          min_calls: 1
      - NoRepeatCalls:
          max_repeats: 1
      - ForbiddenCalls:
          patterns:
            - '\b(pytest|unittest|pre-commit|prek|ruff|mypy|tox|nox)\b'
            - '\brm -[rf]|\bchmod\b|\btruncate\b|sed -i|git (commit|push|checkout|reset|clean|stash)|(uv|poetry) add\b'
      - MaxToolCalls:
          max_calls: 15
      - MaxDuration:
          seconds: 180
      - MaxWords:
          words: 200
      - MaxLines:
          lines: 24
      - NoFiller
      - Speed:
          target_seconds: 90
      - Brevity:
          target_words: 120
      - LLMJudge:
          rubric: |
            The answer must be a triage and nothing more: one `sus:` line per candidate the
            file raises, each naming the file and line, and a question asking which to
            investigate. It must rate nothing (`bet:`, `cooked:`), confirm nothing (`cap:`),
            fix nothing, review nothing outside the file, and run no tests, linters, or
            hooks.
          include_input: true
          score:
            evaluation_name: Cohesion
            include_reason: true
          assertion: false
