name: superjoe
cases:
  - name: researchjoe-verify-package
    inputs:
      agent: researchJoe
      prompt: |
        Work: src/retry_client/retry.py
        Goal: decide whether ledger-retry replaces the hand-rolled retry loop.
        User said: "is ledger-retry worth adding, or do we keep our own retry loop?"
      fixture: retry-client
      script:
        bash:
          'curl -s https://pypi.org/pypi/ledger-retry/json | jq -r ''.info.version, .info.requires_python''': |
            0.9.2
            >=3.11
          'curl -s https://pypi.org/pypi/ledger-retry/json | jq -r ''.info.version''': |
            0.9.2
          'curl -s https://pypi.org/pypi/ledger-retry/json': |
            {"info": {"name": "ledger-retry", "version": "0.9.2", "requires_python": ">=3.11", "license": "MIT", "project_urls": {"Source": "https://github.com/acme-labs/ledger-retry"}}, "releases": {"0.9.2": [{"upload_time_iso_8601": "2026-04-02T10:15:00.000000Z"}]}}
          'gh api repos/acme-labs/ledger-retry': |
            {"stargazers_count": 214, "pushed_at": "2026-08-30T12:00:00Z", "archived": false, "open_issues_count": 3, "license": {"spdx_id": "MIT"}}
          'https://api.github.com/repos/acme-labs/ledger-retry': |
            {"stargazers_count": 214, "pushed_at": "2026-08-30T12:00:00Z", "archived": false, "open_issues_count": 3, "license": {"spdx_id": "MIT"}}
        web_search:
          ledger-retry: |
            PyPI: ledger-retry 0.9.2 — released 2026-04-02, requires-python >=3.11, MIT, wheel 18 kB.
            GitHub: acme-labs/ledger-retry — 214 stars, last push 2026-08-30, MIT, not archived.
            Downloads: 41k per month.
          retry: |
            Comparison of Python retry libraries: tenacity and stamina ship async-aware
            retry loops with jitter and backoff strategies; backoff is unmaintained since
            2023; urllib3 Retry covers HTTP transports only. ledger-retry 0.9.2 is a newer
            single-purpose alternative with the same feature set as the hand-rolled loop.
    evaluators:
      - Contains:
          value: ledger-retry
          evaluation_name: names-package
      - Contains:
          value: '0.9.2'
          evaluation_name: reports-version
      - Contains:
          value: pypi
          case_sensitive: false
          evaluation_name: cites-index
      - ToolCorrectness:
          expected_tools: [Read, Bash]
          allow_extra: true
      - MaxDuration:
          seconds: 180
      - MaxToolCalls:
          max_calls: 20
      - LLMJudge:
          rubric: |
            The answer must read as one finished report for the task: it answers whether
            ledger-retry should replace the hand-rolled retry loop, keeps one goal and one
            voice, and stays grounded in the facts it looked up. It must not claim to have
            changed, added, or installed any code.
          include_input: true
          score:
            evaluation_name: Cohesion
            include_reason: true
          assertion: false
