name: superjoe
cases:
  - name: builderjoe-push-back
    inputs:
      agent: builderJoe
      prompt: |
        Work: src/webhooks/dispatch.py
        Goal: guard dispatch against bad payloads and get it ready for more providers.
        User said: "add type checks on the payload and a friendly error for unknown events, plus a plugin registry with an LRU cache and a fallback chain so we're ready for more providers."
      fixture: speculative-cache
    evaluators:
      - Contract:
          required_patterns:
            - '(?i)(no-code|YAGNI|unnecessary|does not need|nothing to build|skip it|let bad calls crash|trust the signature|side quest)'
      - ToolDiscipline:
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - ruff
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 150
      - ToolBudget:
          max_calls: 10
      - Cohesion: {}
  - name: builderjoe-reuse-helper
    inputs:
      agent: builderJoe
      prompt: |
        Work: src/orders/receipt.py
        Goal: reuse the total that orders.totals already sums.
        User said: "receipt.py walks the prices by hand, but totals.sum_cents is right there."
      fixture: ladder-helper
    evaluators:
      - Contract:
          required_patterns:
            - 'receipt\.py'
      - ToolDiscipline:
          required_tools:
            - Read
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - ruff
            - mypy
            - coverage
      - WorkspaceDiff:
          required_paths:
            - src/orders/receipt.py
          forbidden_paths:
            - src/orders/helpers.py
            - src/orders/sums.py
            - pyproject.toml
      - MaxDuration:
          seconds: 180
      - ToolBudget:
          max_calls: 12
      - Cohesion: {}
  - name: docujoe-clean-docstrings
    inputs:
      agent: docuJoe
      prompt: |
        Work: src/sessions/store.py
        Goal: make every docstring in the file follow the documentation rules.
        User said: "the docstrings in sessions/store.py are noise, clean them up, and while you're there add a README section about session storage."
      fixture: docstring-noise
    evaluators:
      - Contract:
          required_patterns:
            - 'Out of scope\.'
            - 'store\.py'
      - ToolDiscipline:
          required_tools:
            - Read
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - ruff
      - WorkspaceDiff:
          required_paths:
            - src/sessions/store.py
          forbidden_paths:
            - README.md
            - tests/test_store.py
            - pyproject.toml
      - MaxDuration:
          seconds: 180
      - ToolBudget:
          max_calls: 12
      - Cohesion: {}
  - name: docujoe-refresh-stale-docs
    inputs:
      agent: docuJoe
      prompt: |
        Work: change.diff
        Goal: bring the docs of the changed reader API back in line with the code.
        User said: "the reader signature changed, but the README and the docstring still describe the old one."
      fixture: stale-docs
      patch: change.diff
    evaluators:
      - Contract:
          required_patterns:
            - 'README\.md'
            - 'text_encoding'
      - ToolDiscipline:
          required_tools:
            - Read
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - ruff
      - WorkspaceDiff:
          required_paths:
            - README.md
            - src/records/reader.py
          forbidden_paths:
            - pyproject.toml
      - MaxDuration:
          seconds: 240
      - ToolBudget:
          max_calls: 14
      - Cohesion: {}
  - name: inspectorjoe-rate-findings
    inputs:
      agent: inspectorJoe
      prompt: |
        Work: change.diff
        Goal: investigate the confirmed suspicion and rate what it would cost us.
        User said: "triage the new lines, then ask me which one to dig into."
      fixture: journal-patch
      patch: change.diff
      script:
        answer: '1: the mutable default in Journal.total'
    evaluators:
      - Contract:
          required_patterns:
            - 'bet: \d+/10'
            - 'cooked: \d+/10'
      - ToolDiscipline:
          required_tools:
            - Read
            - AskUserQuestion
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 180
      - ToolBudget:
          max_calls: 10
      - Cohesion: {}
  - name: inspectorjoe-triage-only
    inputs:
      agent: inspectorJoe
      prompt: |
        Work: change.diff
        Goal: triage the patch before anyone spends time investigating it.
        User said: "sweep the added lines and tell me what smells off."
      fixture: journal-patch
      patch: change.diff
      script:
        answer: 'None. Triage only for now.'
    evaluators:
      - Contract:
          required_patterns:
            - 'sus: '
            - 'L\d+'
          forbidden_patterns:
            - 'cap: '
            - 'bet: '
            - 'cooked: '
      - ToolDiscipline:
          required_tools:
            - Read
            - AskUserQuestion
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 150
      - ToolBudget:
          max_calls: 8
      - Cohesion: {}
  - name: lazyjoe-ship-ready
    inputs:
      agent: lazyJoe
      prompt: |
        Work: src/slug/format.py
        Goal: cut what should not exist in this file.
        User said: "skim format.py and tell me what to cut."
      fixture: ship-ready
    evaluators:
      - Contract:
          required_patterns:
            - 'No notes\. Ship it\.'
          forbidden_patterns:
            - '(yeet|duh|NPC|cringe|glow up):'
            - 'W: -\d+ lines\.'
      - ToolDiscipline:
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - ruff
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 120
      - ToolBudget:
          max_calls: 6
      - Cohesion: {}
  - name: lazyjoe-tag-findings
    inputs:
      agent: lazyJoe
      prompt: |
        Work: src/config/loader.py
        Goal: cut what should not exist in this loader.
        User said: "this loader feels heavier than it needs to be, tell me what to cut."
      fixture: overbuilt-config
    evaluators:
      - Contract:
          required_patterns:
            - 'L\d+'
            - '(yeet|duh|NPC|cringe|glow up):'
            - 'W: -\d+ lines\.'
      - ToolDiscipline:
          required_tools:
            - Read
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - ruff
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 180
      - ToolBudget:
          max_calls: 10
      - Cohesion: {}
  - name: researchjoe-missing-package
    inputs:
      agent: researchJoe
      prompt: |
        Work: src/csv_export/writer.py
        Goal: decide whether csv-warp is worth adding for the export path.
        User said: "is csv-warp still the thing to use for writing CSV?"
      fixture: csv-export
      script:
        bash:
          'curl -s https://pypi.org/pypi/csv-warp/json': |
            {"message": "Not Found"}
          'curl -s https://pypi.org/pypi/csv-warp/json | jq -r ''.info.version, .info.requires_python''': |
            jq: error (at <stdin>:1): Cannot index string with "info"
        web_search:
          csv-warp: |
            PyPI: not found. No project named csv-warp is published on PyPI.
            GitHub search for csv-warp: no repositories found.
    evaluators:
      - Contract:
          required_patterns:
            - 'csv-warp'
            - '(?i)(not found|does not exist|no such|404|not published|no package|no project|cannot find|could not find)'
          forbidden_patterns:
            - 'csv-warp.{0,40}\d+\.\d+\.\d+'
      - ToolDiscipline:
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 150
      - ToolBudget:
          max_calls: 10
      - Cohesion: {}
  - name: researchjoe-verify-package
    inputs:
      agent: researchJoe
      prompt: |
        Work: src/retry_client/retry.py
        Goal: decide whether ledger-retry replaces the hand-rolled retry loop.
        User said: "is ledger-retry worth adding, or do we keep our own retry loop?"
      fixture: retry-client
      script:
        bash:
          'curl -s https://pypi.org/pypi/ledger-retry/json': |
            {"info": {"name": "ledger-retry", "version": "0.9.2", "requires_python": ">=3.11", "license": "MIT", "project_urls": {"Source": "https://github.com/acme-labs/ledger-retry"}}, "releases": {"0.9.2": [{"upload_time_iso_8601": "2026-04-02T10:15:00.000000Z"}]}}
          'curl -s https://pypi.org/pypi/ledger-retry/json | jq -r ''.info.version, .info.requires_python''': |
            0.9.2
            >=3.11
          'curl -s https://pypi.org/pypi/ledger-retry/json | jq -r ''.info.version''': |
            0.9.2
        web_search:
          ledger-retry: |
            PyPI: ledger-retry 0.9.2 — released 2026-04-02, requires-python >=3.11, MIT, wheel 18 kB.
            GitHub: acme-labs/ledger-retry — 214 stars, last push 2026-08-30, MIT, not archived.
            Downloads: 41k per month.
    evaluators:
      - Contract:
          required_patterns:
            - '0\.9\.2'
            - 'ledger-retry'
            - '(?i)(pypi|github)'
          forbidden_patterns:
            - '(?i)I (added|installed|updated|edited)'
      - ToolDiscipline:
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 180
      - ToolBudget:
          max_calls: 12
      - Cohesion: {}
  - name: secretjoe-prove-injection
    inputs:
      agent: secretJoe
      prompt: |
        Work: change.diff
        Goal: prove what the patch exposes.
        User said: "triage the added lines, then ask me which one to prove."
      fixture: thumbnail-patch
      patch: change.diff
      script:
        answer: '1: the shell command in thumbnail()'
    evaluators:
      - Contract:
          required_patterns:
            - 'receipts:'
            - 'bet: \d+/10'
            - 'cooked: \d+/10'
            - 'side quest:'
      - ToolDiscipline:
          required_tools:
            - Read
            - AskUserQuestion
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 180
      - ToolBudget:
          max_calls: 10
      - Cohesion: {}
  - name: secretjoe-triage-only
    inputs:
      agent: secretJoe
      prompt: |
        Work: change.diff
        Goal: find what the patch could expose.
        User said: "sweep the added lines and tell me what could be exploitable."
      fixture: thumbnail-patch
      patch: change.diff
      script:
        answer: 'None. Nothing gets proven today.'
    evaluators:
      - Contract:
          required_patterns:
            - 'sus: '
            - 'L\d+'
          forbidden_patterns:
            - 'cap: '
            - 'receipts:'
            - 'bet: '
            - 'cooked: '
      - ToolDiscipline:
          required_tools:
            - Read
            - AskUserQuestion
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - curl
            - python -c
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 150
      - ToolBudget:
          max_calls: 8
      - Cohesion: {}
  - name: testjoe-flag-ghost-branch
    inputs:
      agent: testJoe
      prompt: |
        Work: src/ledger/entry.py
        Goal: cover the ledger entries and report every branch coverage cannot reach.
        User said: "run the hooks and the coverage on ledger, then tell me what is left."
      fixture: ghost-branch
      script:
        bash:
          'prek run --all-files': |
            ruff check...............................................................Passed
            trailing-whitespace......................................................Passed
            2 hooks passed
          'prek': |
            ruff check...............................................................Passed
            trailing-whitespace......................................................Passed
            2 hooks passed
          'uv run prek run --all-files': |
            ruff check...............................................................Passed
            trailing-whitespace......................................................Passed
            2 hooks passed
          'uv run pytest --cov=src --cov-report=term-missing': |
            ============ test session starts ============
            collected 0 items
            ---------- coverage: platform darwin, python 3.14.0 ----------
            Name                      Stmts   Miss  Cover   Missing
            -------------------------------------------------------
            src/ledger/__init__.py        0      0   100%
            src/ledger/entry.py          20      3    85%   16, 25-26
            -------------------------------------------------------
            TOTAL                        20      3    85%
            ============ no tests ran in 0.02s ============
          'uv run pytest': |
            ============ test session starts ============
            collected 0 items
            ============ no tests ran in 0.02s ============
          'pytest': |
            ============ test session starts ============
            collected 0 items
            ============ no tests ran in 0.02s ============
    evaluators:
      - Contract:
          required_patterns:
            - 'L\d+: ghost\.'
            - 'L\d+: delulu\.'
      - ToolDiscipline:
          required_tools:
            - Read
            - Bash
          required_commands:
            - '\bprek\b'
            - pytest
          forbidden_commands:
            - pre-commit
      - WorkspaceDiff:
          forbidden_paths:
            - src/ledger/entry.py
      - MaxDuration:
          seconds: 240
      - ToolBudget:
          max_calls: 16
      - Cohesion: {}
  - name: testjoe-run-hooks
    inputs:
      agent: testJoe
      prompt: |
        Work: src/pricing.py
        Goal: run the hooks and the suite, then report every finding.
        User said: "run the pre-commit hooks and the tests on pricing, fix nothing, just report."
      fixture: hook-findings
      script:
        bash:
          'prek run --all-files': |
            ruff check...............................................................Failed
            - hook id: ruff
