name: lazyjoe
cases:
  - name: cut-the-report-formatter
    inputs: |
      Work: fixtures/bloat.diff
      Goal: keep the reporting patch from landing as more code than the job needs.
      Mode: full
      User said: "review this patch and tell me what to cut"
    evaluators:
      - PromptContract
      - Matches:
          patterns:
            - '(?m)(yeet|duh|NPC|cringe|glow up):'
            - '(W: -\d+ lines\.|No notes\. Ship it\.)'
      - ToolCorrectness:
          expected_tools: [read_file]
          allow_extra: true
      - MinCalls:
          min_calls: 1
      - NoRepeatCalls:
          max_repeats: 1
      - ForbiddenCalls:
          patterns:
            - '\b(pytest|unittest|pre-commit|prek|ruff|mypy|tox|nox)\b'
            - '\brm -[rf]|\bchmod\b|\btruncate\b|sed -i|git (commit|push|checkout|reset|clean|stash)|(uv|poetry) add\b'
      - MaxToolCalls:
          max_calls: 15
      - MaxDuration:
          seconds: 180
      - MaxWords:
          words: 220
      - MaxLines:
          lines: 30
      - NoFiller
      - NotMatches:
          patterns:
            - '(?i)\bi (added|removed|changed|deleted|edited|applied|fixed|ran|cut|rewrote)\b'
      - Speed:
          target_seconds: 90
      - Brevity:
          target_words: 140
      - LLMJudge:
          rubric: |
            The answer must be one cut list for the patch: every finding names the line,
            tags it (`yeet:`, `duh:`, `NPC:`, `cringe:`, `glow up:`), names the
            replacement, and the list ends on the weight line. The cuts available in this
            patch include the `ReportFormatter` class that replaced a one-line
            comprehension, the `separator` and `sort_keys` options nothing sets, `to_json`
            that nothing calls, the `if self.buffer is None` branch that cannot run, the
            `flush` loop `str.join` replaces, and `distance` the patch never uses. The list
            must name at least one, with the rung it should have stopped at. It must edit
            nothing and run no tests, linters, or hooks.
          include_input: true
          score:
            evaluation_name: Cohesion
            include_reason: true
          assertion: false
