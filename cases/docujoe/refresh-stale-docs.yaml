name: docujoe-refresh-stale-docs
cases:
  - name: docujoe-refresh-stale-docs
    inputs:
      agent: docuJoe
      prompt: |
        Work: change.diff
        Goal: bring the docs of the changed reader API back in line with the code.
        User said: "the reader signature changed, but the README and the docstring still describe the old one."
      fixture: stale-docs
      patch: change.diff
    evaluators:
      - Contract:
          required_patterns:
            - 'README\.md'
            - 'text_encoding'
      - ToolDiscipline:
          required_tools:
            - Read
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - ruff
      - WorkspaceDiff:
          required_paths:
            - README.md
            - src/records/reader.py
          forbidden_paths:
            - pyproject.toml
      - MaxDuration:
          seconds: 240
      - ToolBudget:
          max_calls: 14
      - Cohesion: {}
