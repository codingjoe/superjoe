name: evals
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/evals.yml
      - agents/**
      - cases.yaml
      - fixtures/**
      - joe_evals/**
      - models.yaml
      - pyproject.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/evals.yml
      - agents/**
      - cases.yaml
      - fixtures/**
      - joe_evals/**
      - models.yaml
      - pyproject.toml
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to score with; defaults to models.yaml
        default: ''
permissions:
  contents: read
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      commented: ${{ steps.comment.outputs.commented }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: docker/setup-buildx-action@v4
      - name: Build the eval container
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: joe-evals:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Restore the baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow evals.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" --name evals-scores --dir baseline || true
      - name: Run the cases
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          FULL: ${{ contains(toJSON(github.event.pull_request.labels.*.name), 'run-evals-full') }}
          MODEL: ${{ inputs.model }}
        run: |
          default=$(yq -r '.default_model' models.yaml)
          if [ "$FULL" = 'true' ]; then
            repeats=3
            models=$(yq -r '.sweep[]' models.yaml)
          else
            repeats=1
            models=${MODEL:-$default}
          fi
          for model in $models; do
            JOE_EVALS_MODEL="$model" JOE_EVALS_REPEATS="$repeats" \
              JOE_EVALS_REPORT="scores-$model.json" \
              JOE_EVALS_BASELINE="baseline/scores-$default.json" \
              uv run --locked joe_evals
          done
      - name: Note the comment
        id: comment
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -s comment.md ]; then
            echo 'commented=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the scores
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-scores
          path: scores-*.json
      - name: Upload the comment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-comment
          path: comment.md
          if-no-files-found: ignore
  comment:
    needs: evals
    if: ${{ !cancelled() && needs.evals.outputs.commented == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: evals-comment
      - name: Post the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("## superjoe evals")) | .id' \
            | tail -1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
