name: secretjoe-triage-only
cases:
  - name: secretjoe-triage-only
    inputs:
      agent: secretJoe
      prompt: |
        Work: change.diff
        Goal: find what the patch could expose.
        User said: "sweep the added lines and tell me what could be exploitable."
      fixture: thumbnail-patch
      patch: change.diff
      script:
        answer: 'None. Nothing gets proven today.'
    evaluators:
      - Contract:
          required_patterns:
            - 'sus: '
            - 'L\d+'
          forbidden_patterns:
            - 'cap: '
            - 'receipts:'
            - 'bet: '
            - 'cooked: '
      - ToolDiscipline:
          required_tools:
            - Read
            - AskUserQuestion
          forbidden_tools:
            - Write
            - Edit
          forbidden_commands:
            - pytest
            - prek
            - pre-commit
            - curl
            - python -c
      - WorkspaceDiff:
          forbidden_paths:
            - '*'
      - MaxDuration:
          seconds: 150
      - ToolBudget:
          max_calls: 8
      - Cohesion: {}
